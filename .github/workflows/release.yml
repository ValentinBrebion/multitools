name: Build and Release Multitools

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Set project version from tag
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          mvn --batch-mode versions:set "-DnewVersion=$($version)" -DgenerateBackupPoms=false

      - name: Build with Maven
        run: mvn --batch-mode clean package

      - name: Prepare application
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''

          New-Item -ItemType Directory -Force -Path target\app
          Copy-Item target\multitools-$version.jar target\app\
          mvn dependency:copy-dependencies -DoutputDirectory=target/app -DincludeScope=runtime

          Remove-Item target\app\javafx-base-21.0.6.jar -ErrorAction SilentlyContinue
          Remove-Item target\app\javafx-controls-21.0.6.jar -ErrorAction SilentlyContinue
          Remove-Item target\app\javafx-fxml-21.0.6.jar -ErrorAction SilentlyContinue
          Remove-Item target\app\javafx-graphics-21.0.6.jar -ErrorAction SilentlyContinue

      - name: Build application image
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''

          New-Item -ItemType Directory -Force -Path package

          jpackage `
            --type exe `
            --name Multitools `
            --input target\app `
            --main-jar "multitools-$version.jar" `
            --main-class com.example.multitools.MainApp `
            --dest package `
            --app-version $version `
            --vendor "Multitools foundation" `
            --description "Application multi-outils avec JavaFX" `
            --win-menu `
            --win-shortcut `
            --icon Multitools.ico `
            --java-options '--module-path=$APPDIR --add-modules=javafx.controls,javafx.fxml'

      - name: Create ZIP
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''

          Copy-Item "package\Multitools-$version.exe" "Multitools-$version.exe"

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''

          gh release create "v$version" `
            "Multitools-$version.exe" `
            --title "Multitools $version" `
            --generate-notes