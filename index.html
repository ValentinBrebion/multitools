<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multitools - Téléchargement</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Colonne gauche -->
        <div class="left-column">
            <div class="top-label"></div>
            
            <div class="graphic-container">
                <div class="layer layer1"></div>
                <div class="layer layer2"></div>
                <div class="layer layer3"></div>
                <div class="layer layer4"></div>
            </div>
            
            <div class="bottom-labels">
                <div class="label"></div>
                <div class="label small"></div>
            </div>
        </div>
        
        <!-- Colonne droite -->
        <div class="right-column">
            <div class="top-label-small">COMPRESSION ZIP WINDOWS</div>
            
            <h1 class="main-title">Multitools</h1>
            
            <p class="description">
                Application de bureau Java modulaire offrant plusieurs outils utilitaires.
            </p>
            
            <div class="download-section">
                <button id="downloadBtn" class="download-btn">Télécharger Multitools.exe</button>
                <span id="fileSize" class="file-size">4.2 MB</span>
            </div>
            
            <div class="version-info">
                <div class="version-row">
                    <span class="label">VERSION</span>
                    <span id="version" class="version">v1.2.6</span>
                </div>
                <div class="version-row">
                    <span class="label">STATUT</span>
                    <span class="status">Version stable</span>
                </div>
            </div>
            
            <div class="bottom-info">
                <div class="info-row">
                    <span class="label">PLATEFORME</span>
                    <span class="value">Windows x64</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const downloadBtn = document.getElementById('downloadBtn');
        const fileSize = document.getElementById('fileSize');
        const version = document.getElementById('version');

        async function getLatestRelease() {
            try {
                downloadBtn.disabled = true;
                downloadBtn.textContent = 'Chargement...';

                const response = await fetch('https://api.github.com/repos/ValentinBrebion/multitools/releases/latest');
                const release = await response.json();

                if (release.assets && release.assets.length > 0) {
                    const asset = release.assets[0];
                    downloadBtn.onclick = () => {
                        window.location.href = asset.browser_download_url;
                    };
                    downloadBtn.textContent = 'Télécharger Multitools.exe';
                    fileSize.textContent = formatFileSize(asset.size);
                    version.textContent = release.tag_name;
                } else {
                    downloadBtn.onclick = () => {
                        window.location.href = release.html_url;
                    };
                    downloadBtn.textContent = 'Voir sur GitHub';
                    version.textContent = release.tag_name;
                }
            } catch (error) {
                console.error('Erreur:', error);
                downloadBtn.onclick = () => {
                    window.location.href = 'https://github.com/ValentinBrebion/multitools/releases/latest';
                };
                downloadBtn.textContent = 'Voir sur GitHub';
            } finally {
                downloadBtn.disabled = false;
            }
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        getLatestRelease();
    </script>
</body>
</html>
