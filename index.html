<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaZip - Téléchargement</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .download-btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
            cursor: pointer;
        }
        .download-btn:hover {
            background: #764ba2;
        }
        .download-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .version {
            margin-top: 20px;
            color: #999;
            font-size: 14px;
        }
        .loading {
            display: none;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>JavaZip</h1>
        <p>Application de compression ZIP avec JavaFX</p>
        <button id="downloadBtn" class="download-btn">Télécharger JavaZip</button>
        <div id="loading" class="loading">Recherche de la dernière version...</div>
        <div id="version" class="version">Version 1.0.0</div>
    </div>

    <script>
        const downloadBtn = document.getElementById('downloadBtn');
        const loading = document.getElementById('loading');
        const versionDiv = document.getElementById('version');

        async function getLatestRelease() {
            try {
                loading.style.display = 'block';
                downloadBtn.disabled = true;

                const response = await fetch('https://api.github.com/repos/ValentinBrebion/multitools/releases/latest');
                const release = await response.json();

                if (release.assets && release.assets.length > 0) {
                    const asset = release.assets[0];
                    downloadBtn.onclick = () => {
                        window.location.href = asset.browser_download_url;
                    };
                    downloadBtn.textContent = 'Télécharger JavaZip.exe';
                    versionDiv.textContent = `Version ${release.tag_name}`;
                } else {
                    downloadBtn.onclick = () => {
                        window.location.href = release.html_url;
                    };
                    downloadBtn.textContent = 'Voir sur GitHub';
                    versionDiv.textContent = `Version ${release.tag_name} - Voir sur GitHub`;
                }
            } catch (error) {
                console.error('Erreur:', error);
                downloadBtn.onclick = () => {
                    window.location.href = 'https://github.com/ValentinBrebion/multitools/releases/latest';
                };
                downloadBtn.textContent = 'Voir sur GitHub';
                versionDiv.textContent = 'Erreur de chargement - Voir sur GitHub';
            } finally {
                loading.style.display = 'none';
                downloadBtn.disabled = false;
            }
        }

        getLatestRelease();
    </script>
</body>
</html>
